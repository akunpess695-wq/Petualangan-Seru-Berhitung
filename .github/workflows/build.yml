
name: Build Android APK v3.7 Fixed

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify character meshes
        shell: bash
        run: |
          python3 - <<'PYVERIFY'
          from pathlib import Path
          import math

          for name in ('putra', 'putri'):
              path = Path('proj/app/src/main/assets/characters') / (name + '.obj')
              if not path.is_file():
                  raise SystemExit(f'Missing OBJ: {path}')

              vertices = 0
              faces = 0
              with path.open(encoding='utf-8') as f:
                  for line_no, line in enumerate(f, 1):
                      parts = line.split()
                      if not parts:
                          continue
                      if parts[0] == 'v':
                          if len(parts) < 4 or not all(
                              math.isfinite(float(x))
                              for x in parts[1:4]
                          ):
                              raise SystemExit(f'Invalid vertex: {path}:{line_no}')
                          vertices += 1
                      elif parts[0] == 'f':
                          if len(parts) < 4:
                              raise SystemExit(f'Invalid face: {path}:{line_no}')
                          for entry in parts[1:]:
                              idx = int(entry.split('/')[0])
                              if idx == 0 or (idx > 0 and idx > vertices) or (
                                  idx < 0 and -idx > vertices
                              ):
                                  raise SystemExit(f'Invalid face index: {path}:{line_no}')
                          faces += 1

              if not vertices or not faces:
                  raise SystemExit(f'Empty geometry: {path}')

              print(f'{name}: {vertices} vertices, {faces} faces OK')
          PYVERIFY

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: proj
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Petualangan-Seru-Berhitung-v3.7-debug
          path: proj/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
