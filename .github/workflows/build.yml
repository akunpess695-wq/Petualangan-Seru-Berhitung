                      c.addView(del, lp(dp(46), 20));
                      del.setOnClickListener(v -> new AlertDialog.Builder(this)
                              .setTitle("Hapus riwayat?")
                              .setMessage("Semua catatan latihan di HP ini akan dihapus.")
                              .setPositiveButton("Hapus", (dl, w) -> {
                                  prefs.edit().remove("hist").apply();
                                  showHistory();
                              })
                              .setNegativeButton("Batal", null)
                              .show());
                  }

                  Button back = button("Kembali", GRAY, 14);
                  back.setTextColor(DARK);
                  c.addView(back, lp(dp(46), has ? 12 : 22));
                  back.setOnClickListener(v -> showMenu());
                  wrap(c);
              }

