name: Build Petualangan Seru Berhitung APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check project files
        shell: bash
        run: |
          set -euo pipefail
          test -f proj/settings.gradle || { echo 'Missing proj/settings.gradle'; exit 1; }
          test -f proj/app/build.gradle || { echo 'Missing proj/app/build.gradle'; exit 1; }

      - name: Use Android SDK from runner
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$SDK" || { echo "Android SDK missing: $SDK"; exit 1; }
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          if [ ! -f "$SDK/platforms/android-34/android.jar" ]; then
            SDKMANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
            test -n "$SDKMANAGER" || { echo 'sdkmanager unavailable'; exit 1; }
            "$SDKMANAGER" --sdk_root="$SDK" 'platforms;android-34' 'build-tools;34.0.0'
          fi
          test -f "$SDK/platforms/android-34/android.jar"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set version code
        shell: bash
        run: echo "VERSION_CODE=$((6280 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - name: Build debug APK
        working-directory: proj
        env:
          # Set secret ini bila ingin CI tetap memakai pb.keystore; kosong = debug key bawaan Android.
          DEBUG_STORE_PASSWORD: ${{ secrets.DEBUG_STORE_PASSWORD }}
          DEBUG_KEY_PASSWORD: ${{ secrets.DEBUG_STORE_PASSWORD }}
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Petualangan-Seru-Berhitung-debug-APK
          path: proj/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
