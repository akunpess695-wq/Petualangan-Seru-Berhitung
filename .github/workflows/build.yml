              private long dayOf(long t) {
                  return (t + TimeZone.getDefault().getOffset(t)) / 86400000L;
              }

              private int streak() {
                  try {
                      JSONArray a = new JSONArray(prefs.getString("hist", "[]"));
                      HashSet<Long> days = new HashSet<>();
                      for (int i = 0; i < a.length(); i++) {
                          days.add(dayOf(a.getJSONObject(i).getLong("t")));
                      }
                      long day = dayOf(System.currentTimeMillis());
                      if (!days.contains(day)) {
                          day--;
                      }
                      int n = 0;
                      while (days.contains(day)) {
                          n++;
                          day--;
                      }
                      return n;
                  } catch (Exception e) {
                      return 0;
                  }
              }

              private void addHistory(int sc, int ok, int n) {
                  try {
                      JSONArray old = new JSONArray(prefs.getString("hist", "[]"));
                      JSONArray arr = new JSONArray();
                      for (int i = Math.max(0, old.length() - 59); i < old.length(); i++) {
                          arr.put(old.get(i));
                      }
                      JSONObject o = new JSONObject();
                      o.put("t", System.currentTimeMillis());
                      o.put("g", gameName());
                      o.put("k", kelas + 1);
                      o.put("s", sc);
                      o.put("c", ok);
                      o.put("n", n);
                      arr.put(o);
                      prefs.edit().putString("hist", arr.toString()).apply();
                  } catch (Exception e) {
                      // Riwayat gagal disimpan: permainan tetap berjalan
                  }
              }

