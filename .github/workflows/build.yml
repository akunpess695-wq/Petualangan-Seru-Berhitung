              // ---------- Pembaruan online ----------

              private String download(String link) throws IOException {
                  if (!link.startsWith("http")) {
                      throw new IOException("Tautan tidak valid");
                  }
                  HttpURLConnection conn = (HttpURLConnection) new URL(link).openConnection();
                  conn.setConnectTimeout(10000);
                  conn.setReadTimeout(15000);
                  conn.setInstanceFollowRedirects(true);
                  try {
                      if (conn.getResponseCode() != 200) {
                          throw new IOException("HTTP " + conn.getResponseCode());
                      }
                      return readAll(conn.getInputStream());
                  } finally {
                      conn.disconnect();
                  }
              }

              private void refreshOnline(final boolean silent) {
                  final String us = soalUrl();
                  final String um = materiUrl();
                  if (us.isEmpty() && um.isEmpty()) {
                      if (!silent) {
                          new AlertDialog.Builder(this)
                                  .setTitle("Tautan belum diatur")
                                  .setMessage("Guru bisa mengatur tautan soal dan materi lewat tombol Soal dari Guru (pakai PIN).")
                                  .setPositiveButton("OK", null)
                                  .show();
                      }
                      return;
                  }
                  final AlertDialog[] dlg = new AlertDialog[1];
                  if (!silent) {
                      dlg[0] = new AlertDialog.Builder(this)
                              .setTitle("Memperbarui...")
                              .setMessage("Mohon tunggu sebentar.")
                              .setCancelable(false)
                              .show();
                  }
                  new Thread(() -> {
                      String t1 = null;
                      String t2 = null;
                      String er1 = null;
                      String er2 = null;
                      if (!us.isEmpty()) {
                          try {
                              t1 = download(us);
                          } catch (Exception e) {
                              er1 = "Soal: gagal mengunduh. Cek internet atau tautannya.";
                          }
                      }
                      if (!um.isEmpty()) {
                          try {
                              t2 = download(um);
                          } catch (Exception e) {
                              er2 = "Materi: gagal mengunduh. Cek internet atau tautannya.";
                          }
                      }
                      final String f1 = t1;
                      final String f2 = t2;
                      final String g1 = er1;
                      final String g2 = er2;
                      runOnUiThread(() -> finishRefresh(silent, dlg[0], f1, f2, g1, g2));
                  }).start();
              }

              private void finishRefresh(boolean silent, AlertDialog dlg, String t1, String t2, String er1, String er2) {
                  if (dlg != null && dlg.isShowing()) {
                      try {
                          dlg.dismiss();
                      } catch (Exception e) {
                          // Dialog sudah tertutup
                      }
                  }
                  if (isFinishing()) {
                      return;
                  }
                  StringBuilder m = new StringBuilder();
                  boolean ok = false;
                  if (t1 != null) {
                      String r = importCsv(t1, true);
                      m.append("Soal: ").append(r).append("\n");
                      if (r.startsWith("Berhasil")) {
                          ok = true;
                      }
                  } else if (er1 != null) {
                      m.append(er1).append("\n");
                  }
                  if (t2 != null) {
                      String r = importMateri(t2);
                      m.append("Materi: ").append(r).append("\n");
                      if (r.startsWith("Berhasil")) {
                          ok = true;
                      }
                  } else if (er2 != null) {
                      m.append(er2).append("\n");
                  }
                  if (ok) {
                      prefs.edit().putLong("lastupd", System.currentTimeMillis()).apply();
                  }
                  if (silent) {
                      if (ok) {
                          Toast.makeText(this, "Soal dan materi diperbarui", Toast.LENGTH_SHORT).show();
                          redraw();
                      }
                  } else {
                      new AlertDialog.Builder(this)
                              .setTitle("Hasil pembaruan")
                              .setMessage(m.toString().trim())
                              .setPositiveButton("OK", (d, w) -> redraw())
                              .show();
                  }
              }

