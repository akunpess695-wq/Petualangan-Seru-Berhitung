              private void sendReport() {
                  String msg = shareText();
                  String wa = digits(teacherWa());
                  try {
                      if (!wa.isEmpty()) {
                          if (wa.startsWith("0")) {
                              wa = "62" + wa.substring(1);
                          }
                          String q = URLEncoder.encode(msg, "UTF-8").replace("+", "%20");
                          startActivity(new Intent(Intent.ACTION_VIEW, Uri.parse("https://wa.me/" + wa + "?text=" + q)));
                      } else {
                          Intent it = new Intent(Intent.ACTION_SEND);
                          it.setType("text/plain");
                          it.putExtra(Intent.EXTRA_TEXT, msg);
                          startActivity(Intent.createChooser(it, "Kirim laporan lewat"));
                      }
                  } catch (Exception e) {
                      Toast.makeText(this, "Tidak bisa membuka WhatsApp atau aplikasi berbagi", Toast.LENGTH_LONG).show();
                  }
              }

