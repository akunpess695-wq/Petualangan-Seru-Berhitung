name: Build APK Belajar Bersama

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Pasang Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Siapkan Android SDK
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" > /dev/null || true

      - name: Buat proyek Petualangan Berhitung
        run: |
          set -e
          mkdir -p proj
          cd proj
          cat > settings.gradle <<'PB_EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "PetualanganBerhitung"
          include ':app'
          PB_EOF
          cat > build.gradle <<'PB_EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          PB_EOF
          cat > gradle.properties <<'PB_EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.nonTransitiveRClass=true
          PB_EOF
          mkdir -p app
          cat > app/build.gradle <<'PB_EOF'
          plugins {
              id 'com.android.application'
          }

          def runNo = (System.getenv("GITHUB_RUN_NUMBER") ?: "0").toInteger()

          android {
              namespace 'com.petualangan.berhitung'
              compileSdk 34

              defaultConfig {
                  applicationId "com.petualangan.berhitung"
                  minSdk 21
                  targetSdk 34
                  versionCode 100 + runNo
                  versionName "5.0"
              }

              signingConfigs {
                  debug {
                      storeFile file('pb.keystore')
                      storePassword 'berhitung123'
                      keyAlias 'berhitung'
                      keyPassword 'berhitung123'
                  }
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          }
          PB_EOF
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'PB_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="true"
                  android:icon="@drawable/logo"
                  android:label="Belajar Bersama"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>

          </manifest>
          PB_EOF
          mkdir -p app/src/main/res/drawable-nodpi
          base64 -d > app/src/main/res/drawable-nodpi/logo.png <<'PB_EOF'
