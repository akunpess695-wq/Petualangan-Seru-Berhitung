      - name: Pasang Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        working-directory: proj
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Cek hasil APK
        run: |
          ls -l proj/app/build/outputs/apk/debug/
          SIZE=$(stat -c%s proj/app/build/outputs/apk/debug/app-debug.apk)
          echo "Ukuran APK: $SIZE byte"
          test "$SIZE" -gt 8000

      - name: Unggah APK
        uses: actions/upload-artifact@v4
        with:
          name: Petualangan-Berhitung-APK
          path: proj/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
