name: Build APK Belajar Bersama

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # perlu untuk membuat GitHub Release

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # versionCode otomatis naik di setiap build (dibaca oleh app/build.gradle)
  VERSION_CODE: ${{ github.run_number }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Ambil source
        uses: actions/checkout@v4

      - name: Pasang Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Siapkan Android SDK
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          set +o pipefail
          yes | "$SDKM" --licenses > /dev/null
          set -o pipefail
          "$SDKM" "platforms;android-34" "build-tools;34.0.0"

      - name: Pasang Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK debug
        working-directory: proj
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Lint (tidak menggagalkan build)
        working-directory: proj
        continue-on-error: true
        run: gradle lintDebug --no-daemon

      - name: Cek hasil APK debug
        run: |
          APK=proj/app/build/outputs/apk/debug/app-debug.apk
          ls -l proj/app/build/outputs/apk/debug/
          SIZE=$(stat -c%s "$APK")
          echo "Ukuran APK: $SIZE byte"
          test "$SIZE" -gt 20000
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "$APK"

      - name: Unggah APK debug
        uses: actions/upload-artifact@v4
        with:
          name: Belajar-Bersama-debug-${{ github.run_number }}
          path: proj/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      # ---------- Release: hanya saat push tag, misalnya v4.3 ----------
      - name: Siapkan keystore release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Secret RELEASE_KEYSTORE_B64 belum diisi (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$GITHUB_WORKSPACE/release.keystore"

      - name: Build APK dan AAB release
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: proj
        env:
          RELEASE_KEYSTORE: ${{ github.workspace }}/release.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          gradle assembleRelease bundleRelease --no-daemon --stacktrace
          mkdir -p ../dist
          cp app/build/outputs/apk/release/app-release.apk "../dist/Belajar-Bersama-${GITHUB_REF_NAME}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "../dist/Belajar-Bersama-${GITHUB_REF_NAME}.aab"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "../dist/Belajar-Bersama-${GITHUB_REF_NAME}.apk"

      - name: Buat GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
