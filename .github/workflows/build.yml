                  }
                  int sumC = 0;
                  int sumN = 0;
                  for (int i = 0; i < a.length(); i++) {
                      JSONObject o = a.optJSONObject(i);
                      if (o != null) {
                          sumC += o.optInt("c");
                          sumN += o.optInt("n");
                      }
                  }
                  boolean has = a.length() > 0;

                  LinearLayout cs = card();
                  cs.addView(heading("Ringkasan"), lp(WRAP, 0));
                  TextView sm = text("Latihan selesai: " + a.length()
