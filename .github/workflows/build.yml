                  if (!has) {
                      c.addView(text("Belum ada latihan. Ayo mulai belajar!", 14, DARK, false), lp(WRAP, 18));
                  }
                  int shown = 0;
                  for (int i = a.length() - 1; i >= 0 && shown < 30; i--) {
                      JSONObject o = a.optJSONObject(i);
                      if (o == null) {
                          continue;
                      }
                      LinearLayout row = card();
                      TextView t = text(stamp(o.optLong("t")) + "\n" + o.optString("g") + " • Kelas " + o.optInt("k")
                              + "\nSkor " + o.optInt("s") + " • Benar " + o.optInt("c") + "/" + o.optInt("n"),
                              14, DARK, false);
                      t.setGravity(Gravity.START);
                      row.addView(t, new LinearLayout.LayoutParams(MATCH, WRAP));
                      c.addView(row, lp(WRAP, 10));
                      shown++;
                  }

                  if (has) {
