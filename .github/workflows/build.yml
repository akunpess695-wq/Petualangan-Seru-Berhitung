name: Build APK Belajar Bersama

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # perlu untuk membuat GitHub Release

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # versionCode otomatis naik di setiap build (dibaca oleh app/build.gradle)
  VERSION_CODE: ${{ github.run_number }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Pasang Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Siapkan Android SDK
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          set +o pipefail
          yes | "$SDKM" --licenses > /dev/null
          set -o pipefail
          "$SDKM" "platforms;android-34" "build-tools;34.0.0"

      - name: Buat proyek Petualangan Berhitung
        run: |
          set -e
          mkdir -p proj
          cd proj
          cat > settings.gradle <<'PB_EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "PetualanganBerhitung"
          include ':app'
          PB_EOF
          cat > build.gradle <<'PB_EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          PB_EOF
          cat > gradle.properties <<'PB_EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.nonTransitiveRClass=true
          PB_EOF
          mkdir -p app
          cat > app/build.gradle <<'PB_EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.petualangan.berhitung'
              compileSdk 34

              defaultConfig {
                  applicationId "com.petualangan.belajarbersama"
                  minSdk 21
                  targetSdk 34
                  versionCode Integer.parseInt(System.getenv('VERSION_CODE') ?: '11')
                  versionName "5.6"
              }

              signingConfigs {
                  debug {
                      storeFile file('pb.keystore')
                      storePassword 'berhitung123'
                      keyAlias 'berhitung'
                      keyPassword 'berhitung123'
                  }
                  release {
                      // Diisi dari GitHub Secrets (lihat langkah "Siapkan keystore release")
                      def ks = System.getenv('RELEASE_KEYSTORE')
                      if (ks) {
                          storeFile file(ks)
                          storePassword System.getenv('RELEASE_STORE_PASSWORD')
                          keyAlias System.getenv('RELEASE_KEY_ALIAS')
                          keyPassword System.getenv('RELEASE_KEY_PASSWORD')
                      }
                  }
              }

              buildTypes {
                  release {
                      minifyEnabled true
                      shrinkResources true
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
                      if (System.getenv('RELEASE_KEYSTORE')) {
                          signingConfig signingConfigs.release
                      }
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          }
          PB_EOF
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'PB_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.VIBRATE" />

              <uses-feature android:name="android.hardware.touchscreen" android:required="false" />
              <uses-feature android:name="android.software.leanback" android:required="false" />

              <application
                  android:allowBackup="true"
                  android:icon="@drawable/logo"
                  android:banner="@drawable/logo"
                  android:label="Belajar Bersama"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|screenSize|smallestScreenSize|screenLayout|keyboardHidden|uiMode"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>

          </manifest>
          PB_EOF
          mkdir -p app/src/main/res/drawable-nodpi
          base64 -d > app/src/main/res/drawable-nodpi/logo.png <<'PB_EOF'
