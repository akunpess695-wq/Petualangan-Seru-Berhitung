              private void loadMateri() {
                  materi.clear();
                  try {
                      JSONArray arr = new JSONArray(readAll(openFileInput(MATERI_FILE)));
                      for (int i = 0; i < arr.length(); i++) {
                          JSONObject o = arr.getJSONObject(i);
                          M m = new M();
                          m.subj = o.getInt("s");
                          m.kelas = o.getInt("k");
                          m.title = o.getString("j");
                          m.url = o.getString("u");
                          m.note = o.optString("n", "");
                          materi.add(m);
                      }
                  } catch (Exception e) {
                      // Belum ada materi tersimpan
                  }
              }

              private boolean saveMateri() {
                  try {
                      JSONArray arr = new JSONArray();
                      for (M m : materi) {
                          JSONObject o = new JSONObject();
                          o.put("s", m.subj);
                          o.put("k", m.kelas);
                          o.put("j", m.title);
                          o.put("u", m.url);
                          o.put("n", m.note);
                          arr.put(o);
                      }
                      OutputStream out = openFileOutput(MATERI_FILE, MODE_PRIVATE);
                      try {
                          out.write(arr.toString().getBytes(StandardCharsets.UTF_8));
                      } finally {
                          out.close();
                      }
                      return true;
                  } catch (Exception e) {
                      return false;
                  }
              }

              private char delim(String s) {
                  int nl = s.indexOf('\n');
                  String first = nl >= 0 ? s.substring(0, nl) : s;
                  char d = ',';
                  int most = cnt(first, ',');
                  if (cnt(first, ';') > most) {
                      d = ';';
                      most = cnt(first, ';');
                  }
                  if (cnt(first, '\t') > most) {
                      d = '\t';
                  }
                  return d;
              }

              private String importMateri(String s) {
                  if (s.length() > 0 && s.charAt(0) == '﻿') {
                      s = s.substring(1);
                  }
                  ArrayList<ArrayList<String>> rows = parseCsv(s, delim(s));
                  if (rows.isEmpty()) {
                      return "Berkas materi kosong.";
                  }
                  ArrayList<String> head = rows.get(0);
                  int cm = col(head, "mapel");
                  int ck = col(head, "kelas");
                  int cj = col(head, "judul");
                  int ct = col(head, "tautan");
                  int cn = col(head, "keterangan");
                  if (cm < 0 || ck < 0 || cj < 0 || ct < 0) {
                      return "Judul kolom materi tidak cocok. Pakai: mapel, kelas, judul, tautan, keterangan.";
                  }
                  ArrayList<M> fresh = new ArrayList<>();
                  int skipped = 0;
                  for (int r = 1; r < rows.size(); r++) {
                      ArrayList<String> row = rows.get(r);
                      if (isBlank(row)) {
                          continue;
                      }
                      int sj = parseSubject(cell(row, cm));
                      int kl = parseKelas(cell(row, ck));
                      String jd = cell(row, cj);
                      String ur = cell(row, ct);
                      if (sj < 0 || kl < 1 || kl > 6 || jd.isEmpty() || !ur.startsWith("http")) {
                          skipped++;
                          continue;
                      }
                      M m = new M();
                      m.subj = sj;
                      m.kelas = kl;
                      m.title = jd;
                      m.url = ur;
                      m.note = cell(row, cn);
                      fresh.add(m);
                  }
                  if (fresh.isEmpty()) {
                      return "Tidak ada materi yang valid di berkas.";
                  }
                  materi.clear();
                  materi.addAll(fresh);
                  saveMateri();
                  return "Berhasil: " + fresh.size() + " materi dimuat."
                          + (skipped > 0 ? " " + skipped + " baris dilewati." : "");
              }

