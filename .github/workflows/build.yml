name: Build APK Berhitung

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Pasang Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Siapkan Android SDK
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" > /dev/null || true

      - name: Buat proyek Petualangan Berhitung
        run: |
          set -e
          mkdir -p proj
          cd proj
          cat > settings.gradle <<'PB_EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "PetualanganBerhitung"
          include ':app'
          PB_EOF
          cat > build.gradle <<'PB_EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          PB_EOF
          cat > gradle.properties <<'PB_EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.nonTransitiveRClass=true
          PB_EOF
          mkdir -p app
          cat > app/build.gradle <<'PB_EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.petualangan.berhitung'
              compileSdk 34

              defaultConfig {
                  applicationId "com.petualangan.berhitung"
                  minSdk 21
                  targetSdk 34
                  versionCode 3
                  versionName "2.1"
              }

              signingConfigs {
                  debug {
                      storeFile file('pb.keystore')
                      storePassword 'berhitung123'
                      keyAlias 'berhitung'
                      keyPassword 'berhitung123'
                  }
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          }
          PB_EOF
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'PB_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"> <application android:allowBackup="true" android:icon="@drawable/ic_launcher" android:label="Petualangan Berhitung" android:theme="@android:style/Theme.Material.Light.NoActionBar"> <activity android:name=".MainActivity" android:exported="true" android:screenOrientation="portrait"> <intent-filter> <action android:name="android.intent.action.MAIN" /> <category android:name="android.intent.category.LAUNCHER" /> </intent-filter> </activity> </application> </manifest>
          PB_EOF
          mkdir -p app/src/main/res/drawable
          cat > app/src/main/res/drawable/ic_launcher.xml <<'PB_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="96dp" android:height="96dp" android:viewportWidth="96" android:viewportHeight="96"> <path android:fillColor="#FF9800" android:pathData="M16,0 H80 A16,16 0 0 1 96,16 V80 A16,16 0 0 1 80,96 H16 A16,16 0 0 1 0,80 V16 A16,16 0 0 1 16,0 Z" /> <path android:fillColor="#FFFFFF" android:pathData="M42,20 H54 V42 H76 V54 H54 V76 H42 V54 H20 V42 H42 Z" /> </vector>
          PB_EOF
          mkdir -p app/src/main/java/com/petualangan/berhitung
          cat > app/src/main/java/com/petualangan/berhitung/MainActivity.java <<'PB_EOF'
          package com.petualangan.berhitung;

          import android.app.Activity;
          import android.content.SharedPreferences;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.view.Gravity;
          import android.view.ViewGroup;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;

          import java.util.Arrays;
          import java.util.Random;

          public class MainActivity extends Activity {

              private static final int TOTAL = 10;
              private static final int WRAP = ViewGroup.LayoutParams.WRAP_CONTENT;
              private static final int MATCH = ViewGroup.LayoutParams.MATCH_PARENT;

              private static final int ORANGE = Color.parseColor("#FB8C00");
              private static final int ORANGE_DARK = Color.parseColor("#E65100");
              private static final int GREEN = Color.parseColor("#43A047");
              private static final int RED = Color.parseColor("#E53935");
              private static final int BLUE = Color.parseColor("#1E88E5");
              private static final int PURPLE = Color.parseColor("#8E24AA");
              private static final int BG = Color.parseColor("#FFF8E1");
              private static final int DARK = Color.parseColor("#4E342E");
              private static final int GRAY = Color.parseColor("#E0E0E0");

              // Tingkat kesulitan soal: 0 Easy, 1 Normal, 2 Hard, 3 Extreme
              private static final String[] DIFF_NAMES = {"Easy", "Normal", "Hard", "Extreme"};
              private static final String[] DIFF_DESC = {
                      "Angka kecil \u2022 4 nyawa",
                      "Angka sedang \u2022 3 nyawa",
                      "Angka besar \u2022 2 nyawa",
                      "Angka sangat besar \u2022 1 nyawa"
              };
              private static final int[] DIFF_COLOR = {GREEN, BLUE, ORANGE, RED};
              private static final int[] DIFF_LIVES = {4, 3, 2, 1};
              private static final int[] DIFF_BASE = {5, 10, 25, 50};
              private static final int[] DIFF_STEP = {1, 2, 5, 15};
              private static final int[] DIFF_MUL_A = {5, 0, 12, 20};
              private static final int[] DIFF_MUL_B = {5, 10, 12, 20};

              // Batas waktu per soal yang bisa diatur (detik)
              private static final int SECS_MIN = 3;
              private static final int SECS_MAX = 120;

              private final Random rnd = new Random();
              private final Handler handler = new Handler(Looper.getMainLooper());
              private SharedPreferences prefs;

              private int screen;
              private int mode;
              private int diff = 1;
              private boolean timed = false;
              private int secs = 10;
              private int index;
              private int score;
              private int lives;
              private int correct;
              private int answer;
              private int timeLeft;
              private boolean locked;

              private TextView tvInfo;
              private TextView tvTimer;
              private TextView tvQuestion;
              private TextView tvFeedback;
              private final Button[] opts = new Button[4];
              private Button correctBtn;

              private final Runnable tick = new Runnable() {
                  @Override
                  public void run() {
                      if (locked) {
                          return;
                      }
                      timeLeft--;
                      if (timeLeft <= 0) {
                          timeout();
                      } else {
                          showTime();
                          handler.postDelayed(this, 1000);
                      }
                  }
              };

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  prefs = getSharedPreferences("berhitung", MODE_PRIVATE);
                  showMenu();
              }

              @Override
              protected void onDestroy() {
                  handler.removeCallbacksAndMessages(null);
                  super.onDestroy();
              }

              @Override
              public void onBackPressed() {
                  if (screen == 0) {
                      super.onBackPressed();
                  } else {
                      showMenu();
                  }
              }

              // ---------- Helper tampilan ----------

              private int dp(int v) {
                  return Math.round(v * getResources().getDisplayMetrics().density);
              }

              private GradientDrawable box(int color, int radiusDp) {
                  GradientDrawable g = new GradientDrawable();
                  g.setColor(color);
                  g.setCornerRadius(dp(radiusDp));
                  return g;
              }

              private TextView text(String s, int sp, int color, boolean bold) {
                  TextView t = new TextView(this);
                  t.setText(s);
                  t.setTextSize(sp);
                  t.setTextColor(color);
                  t.setGravity(Gravity.CENTER);
                  if (bold) {
                      t.setTypeface(Typeface.DEFAULT_BOLD);
                  }
                  return t;
              }

              private Button button(String s, int color, int sp) {
                  Button b = new Button(this);
                  b.setText(s);
                  b.setAllCaps(false);
                  b.setTextSize(sp);
                  b.setTextColor(Color.WHITE);
                  b.setTypeface(Typeface.DEFAULT_BOLD);
                  b.setBackground(box(color, 16));
                  return b;
              }

              private void flat(Button b) {
                  b.setMinWidth(0);
                  b.setMinimumWidth(0);
                  b.setMinHeight(0);
                  b.setMinimumHeight(0);
                  b.setPadding(0, 0, 0, 0);
              }

              private LinearLayout column() {
                  LinearLayout l = new LinearLayout(this);
                  l.setOrientation(LinearLayout.VERTICAL);
                  l.setGravity(Gravity.CENTER_HORIZONTAL);
                  l.setPadding(dp(20), dp(32), dp(20), dp(24));
                  l.setBackgroundColor(BG);
                  return l;
              }

              private LinearLayout.LayoutParams lp(int height, int topDp) {
                  LinearLayout.LayoutParams p = new LinearLayout.LayoutParams(MATCH, height);
                  p.topMargin = dp(topDp);
                  return p;
              }

              private LinearLayout.LayoutParams weight(int leftDp, int rightDp) {
                  LinearLayout.LayoutParams p = new LinearLayout.LayoutParams(0, MATCH, 1f);
                  p.leftMargin = dp(leftDp);
                  p.rightMargin = dp(rightDp);
                  return p;
              }

              private LinearLayout.LayoutParams fixed(int widthDp) {
                  LinearLayout.LayoutParams p = new LinearLayout.LayoutParams(dp(widthDp), MATCH);
                  p.leftMargin = dp(3);
                  p.rightMargin = dp(3);
                  return p;
              }

              private String bestKey() {
                  return "best_" + diff + (timed ? "_t" : "");
              }

              private String modeLabel() {
                  return timed ? "Berwaktu " + secs + " detik" : "Tanpa waktu";
              }

              // ---------- Menu ----------

              private void showMenu() {
                  handler.removeCallbacksAndMessages(null);
                  screen = 0;
                  diff = prefs.getInt("diff", 1);
                  if (diff < 0 || diff > 3) {
                      diff = 1;
                  }
                  timed = prefs.getBoolean("timed", false);
                  secs = Math.max(SECS_MIN, Math.min(SECS_MAX, prefs.getInt("secs", 10)));

                  LinearLayout c = column();
                  c.setGravity(Gravity.CENTER);
                  c.addView(text("\u2B50", 56, ORANGE, false), lp(WRAP, 0));
                  c.addView(text("Petualangan Berhitung", 30, ORANGE_DARK, true), lp(WRAP, 4));
                  c.addView(text("Ayo belajar berhitung sambil bermain!", 16, DARK, false), lp(WRAP, 6));

                  // Tingkat kesulitan soal
                  c.addView(text("Tingkat kesulitan", 16, DARK, true), lp(WRAP, 16));
                  LinearLayout drow = new LinearLayout(this);
                  drow.setOrientation(LinearLayout.HORIZONTAL);
                  c.addView(drow, lp(dp(48), 8));
                  for (int i = 0; i < 4; i++) {
                      final int d = i;
                      Button b = button(DIFF_NAMES[i], i == diff ? DIFF_COLOR[i] : GRAY, 12);
                      b.setTextColor(i == diff ? Color.WHITE : DARK);
                      flat(b);
                      drow.addView(b, weight(i == 0 ? 0 : 3, i == 3 ? 0 : 3));
                      b.setOnClickListener(v -> {
                          prefs.edit().putInt("diff", d).apply();
                          showMenu();
                      });
                  }
                  c.addView(text(DIFF_DESC[diff], 14, DARK, false), lp(WRAP, 8));

                  // Mode waktu
                  c.addView(text("Mode waktu", 16, DARK, true), lp(WRAP, 16));
                  LinearLayout trow = new LinearLayout(this);
                  trow.setOrientation(LinearLayout.HORIZONTAL);
                  c.addView(trow, lp(dp(48), 8));
                  trow.addView(modeChip("Tanpa waktu", !timed, false), weight(0, 4));
                  trow.addView(modeChip("Berwaktu", timed, true), weight(4, 0));

                  if (timed) {
                      LinearLayout srow = new LinearLayout(this);
                      srow.setOrientation(LinearLayout.HORIZONTAL);
                      c.addView(srow, lp(dp(48), 10));
                      srow.addView(stepButton("\u22125", -5), fixed(52));
                      srow.addView(stepButton("\u22121", -1), fixed(52));
                      srow.addView(text(secs + " detik", 18, PURPLE, true),
                              new LinearLayout.LayoutParams(0, MATCH, 1f));
                      srow.addView(stepButton("+1", 1), fixed(52));
                      srow.addView(stepButton("+5", 5), fixed(52));
                      c.addView(text("Waktu per soal, atur dengan tombol di atas", 12, DARK, false),
                              lp(WRAP, 4));
                  }

                  c.addView(text("Skor terbaik (" + DIFF_NAMES[diff] + ", "
                                  + (timed ? "berwaktu" : "tanpa waktu") + "): " + prefs.getInt(bestKey(), 0),
                          16, PURPLE, true), lp(WRAP, 14));

                  addMenuButton(c, "\u2795 Penjumlahan", ORANGE, 0);
                  addMenuButton(c, "\u2796 Pengurangan", BLUE, 1);
                  addMenuButton(c, "\u2716 Perkalian", GREEN, 2);
                  addMenuButton(c, "\uD83C\uDFB2 Campur", PURPLE, 3);

                  ScrollView sv = new ScrollView(this);
                  sv.setFillViewport(true);
                  sv.setBackgroundColor(BG);
                  sv.addView(c);
                  setContentView(sv);
              }

              private Button modeChip(String label, boolean selected, final boolean value) {
                  Button b = button(label, selected ? PURPLE : GRAY, 14);
                  b.setTextColor(selected ? Color.WHITE : DARK);
                  flat(b);
                  b.setOnClickListener(v -> {
                      prefs.edit().putBoolean("timed", value).apply();
                      showMenu();
                  });
                  return b;
              }

              private Button stepButton(String label, final int delta) {
                  Button b = button(label, ORANGE, 14);
                  flat(b);
                  b.setOnClickListener(v -> {
                      int n = Math.max(SECS_MIN, Math.min(SECS_MAX, secs + delta));
                      prefs.edit().putInt("secs", n).apply();
                      showMenu();
                  });
                  return b;
              }

              private void addMenuButton(LinearLayout c, String label, int color, final int m) {
                  Button b = button(label, color, 20);
                  c.addView(b, lp(dp(60), 12));
                  b.setOnClickListener(v -> startGame(m));
              }

              // ---------- Permainan ----------

              private void startGame(int m) {
                  mode = m;
                  index = 0;
                  score = 0;
                  lives = DIFF_LIVES[diff];
                  correct = 0;
                  showGame();
                  nextQuestion();
              }

              private void showGame() {
                  screen = 1;
                  LinearLayout c = column();

                  tvInfo = text("", 18, DARK, true);
                  c.addView(tvInfo, lp(WRAP, 0));

                  tvTimer = text(" ", 18, DARK, true);
                  c.addView(tvTimer, lp(WRAP, 8));

                  tvQuestion = text("", 48, ORANGE_DARK, true);
                  c.addView(tvQuestion, lp(WRAP, 28));

                  tvFeedback = text(" ", 20, DARK, true);
                  c.addView(tvFeedback, lp(WRAP, 16));

                  for (int r = 0; r < 2; r++) {
                      LinearLayout row = new LinearLayout(this);
                      row.setOrientation(LinearLayout.HORIZONTAL);
                      c.addView(row, lp(dp(84), 16));
                      for (int k = 0; k < 2; k++) {
                          Button b = button("", BLUE, 28);
                          row.addView(b, weight(k == 0 ? 0 : 8, k == 0 ? 8 : 0));
                          opts[r * 2 + k] = b;
                      }
                  }

                  Button back = button("Menu", PURPLE, 16);
                  c.addView(back, lp(dp(52), 36));
                  back.setOnClickListener(v -> showMenu());

                  setContentView(c);
              }

              private void nextQuestion() {
                  if (index >= TOTAL || lives <= 0) {
                      showResult();
                      return;
                  }
                  index++;
                  locked = false;

                  int max = DIFF_BASE[diff] + (index - 1) * DIFF_STEP[diff];
                  int op = (mode == 3) ? rnd.nextInt(3) : mode;
                  int a;
                  int b;
                  String sym;
                  if (op == 0) {
                      a = 1 + rnd.nextInt(max);
                      b = 1 + rnd.nextInt(max);
                      answer = a + b;
                      sym = "+";
                  } else if (op == 1) {
                      a = 1 + rnd.nextInt(max);
                      b = 1 + rnd.nextInt(a);
                      answer = a - b;
                      sym = "-";
                  } else {
                      int aMax = (diff == 1) ? Math.min(10, 2 + index) : DIFF_MUL_A[diff];
                      a = 1 + rnd.nextInt(aMax);
                      b = 1 + rnd.nextInt(DIFF_MUL_B[diff]);
                      answer = a * b;
                      sym = "\u00D7";
                  }

                  tvQuestion.setText(a + " " + sym + " " + b + " = ?");
                  tvFeedback.setText(" ");

                  int spread = Math.max(10, answer / 4);
                  int pos = rnd.nextInt(4);
                  int[] vals = new int[4];
                  Arrays.fill(vals, -1);
                  vals[pos] = answer;
                  for (int i = 0; i < 4; i++) {
                      if (i == pos) {
                          continue;
                      }
                      int v;
                      boolean bad;
                      do {
                          v = answer + rnd.nextInt(2 * spread + 1) - spread;
                          bad = (v < 0 || v == answer);
                          for (int j = 0; j < 4 && !bad; j++) {
                              if (vals[j] == v) {
                                  bad = true;
                              }
                          }
                      } while (bad);
                      vals[i] = v;
                  }

                  for (int i = 0; i < 4; i++) {
                      final int value = vals[i];
                      final Button btn = opts[i];
                      btn.setText(String.valueOf(value));
                      btn.setBackground(box(BLUE, 16));
                      if (i == pos) {
                          correctBtn = btn;
                      }
                      btn.setOnClickListener(v -> choose(value, btn));
                  }

                  handler.removeCallbacks(tick);
                  if (timed) {
                      timeLeft = secs;
                      showTime();
                      handler.postDelayed(tick, 1000);
                  } else {
                      tvTimer.setText(" ");
                  }
                  updateInfo();
              }

              private void showTime() {
                  tvTimer.setText("Waktu: " + timeLeft + " detik");
                  tvTimer.setTextColor(timeLeft <= 3 ? RED : DARK);
              }

              private void choose(int value, Button btn) {
                  if (locked) {
                      return;
                  }
                  locked = true;
                  handler.removeCallbacks(tick);
                  if (value == answer) {
                      score += 10;
                      correct++;
                      btn.setBackground(box(GREEN, 16));
                      tvFeedback.setText("Benar! \uD83C\uDF89");
                      tvFeedback.setTextColor(GREEN);
                  } else {
                      lives--;
                      btn.setBackground(box(RED, 16));
                      correctBtn.setBackground(box(GREEN, 16));
                      tvFeedback.setText("Oops! Jawabannya " + answer);
                      tvFeedback.setTextColor(RED);
                  }
                  updateInfo();
                  handler.postDelayed(this::nextQuestion, 1000);
              }

              private void timeout() {
                  locked = true;
                  lives--;
                  tvTimer.setText("Waktu habis!");
                  tvTimer.setTextColor(RED);
                  correctBtn.setBackground(box(GREEN, 16));
                  tvFeedback.setText("Jawabannya " + answer);
                  tvFeedback.setTextColor(RED);
                  updateInfo();
                  handler.postDelayed(this::nextQuestion, 1000);
              }

              private void updateInfo() {
                  StringBuilder h = new StringBuilder();
                  for (int i = 0; i < lives; i++) {
                      h.append("\u2764\uFE0F");
                  }
                  tvInfo.setText("Soal " + index + "/" + TOTAL + " \u2B50 " + score + " " + h);
              }

              // ---------- Hasil ----------

              private void showResult() {
                  screen = 2;
                  String key = bestKey();
                  int best = prefs.getInt(key, 0);
                  boolean rekor = score > best;
                  if (rekor) {
                      prefs.edit().putInt(key, score).apply();
                  }
                  int stars = correct >= 9 ? 3 : correct >= 6 ? 2 : correct >= 3 ? 1 : 0;

                  LinearLayout c = column();
                  c.setGravity(Gravity.CENTER);
                  c.addView(text(lives <= 0 ? "Nyawa habis!" : "Selesai!", 32, ORANGE_DARK, true), lp(WRAP, 0));
                  c.addView(text("Tingkat: " + DIFF_NAMES[diff] + " \u2022 " + modeLabel(), 16,
                          DIFF_COLOR[diff], true), lp(WRAP, 6));

                  StringBuilder s = new StringBuilder();
                  for (int i = 0; i < 3; i++) {
                      s.append(i < stars ? "\u2B50" : "\u2606");
                  }
                  c.addView(text(s.toString(), 44, ORANGE, false), lp(WRAP, 14));
                  c.addView(text("Skor: " + score, 28, DARK, true), lp(WRAP, 14));
                  c.addView(text("Benar " + correct + " dari " + TOTAL, 18, DARK, false), lp(WRAP, 8));
                  if (rekor) {
                      c.addView(text("Rekor baru! \uD83C\uDFC6", 20, PURPLE, true), lp(WRAP, 12));
                  }

                  Button again = button("Main Lagi", GREEN, 22);
                  c.addView(again, lp(dp(64), 28));
                  again.setOnClickListener(v -> startGame(mode));

                  Button menu = button("Menu Utama", ORANGE, 20);
                  c.addView(menu, lp(dp(64), 14));
                  menu.setOnClickListener(v -> showMenu());

                  setContentView(c);
              }
          }
          PB_EOF
          mkdir -p app
          base64 -d > app/pb.keystore <<'PB_EOF'
          MIIKKgIBAzCCCdQGCSqGSIb3DQEHAaCCCcUEggnBMIIJvTCCBbQGCSqGSIb3DQEHAaCCBaUEggWh
