plugins {
    id 'com.android.application'
}

android {
    namespace 'com.petualangan.berhitung'
    compileSdk 34

    defaultConfig {
        applicationId "com.petualangan.belajarbersama"
        minSdk 21
        targetSdk 34
        versionCode Integer.parseInt(System.getenv('VERSION_CODE') ?: '6280')
        // Samakan dengan APP_VERSION di MainActivity.java.
        versionName "6.28.0"
    }

    signingConfigs {
        // Isi lewat env DEBUG_KEYSTORE/DEBUG_STORE_PASSWORD. Tanpa env, Gradle memakai
        // debug keystore bawaan Android; jangan simpan password keystore di repo.
        def debugStore = System.getenv('DEBUG_KEYSTORE') ?: 'pb.keystore'
        def debugStorePass = System.getenv('DEBUG_STORE_PASSWORD')
        if (debugStorePass && file(debugStore).exists()) {
            debug {
                storeFile file(debugStore)
                storePassword debugStorePass
                keyAlias System.getenv('DEBUG_KEY_ALIAS') ?: 'berhitung'
                keyPassword System.getenv('DEBUG_KEY_PASSWORD') ?: debugStorePass
            }
        }
        release {
            // Diisi dari GitHub Secrets (lihat langkah "Siapkan keystore release")
            def ks = System.getenv('RELEASE_KEYSTORE')
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('RELEASE_STORE_PASSWORD')
                keyAlias System.getenv('RELEASE_KEY_ALIAS')
                keyPassword System.getenv('RELEASE_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            if (System.getenv('RELEASE_KEYSTORE')) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
